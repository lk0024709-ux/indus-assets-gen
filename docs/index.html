<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1220" />
  <title>Indus Asset Viewer - Buildings</title>

  <!-- Google's <model-viewer> via CDN (with a fallback CDN for resilience) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script type="module">
    if (!customElements.get("model-viewer")) {
      const fallback = document.createElement("script");
      fallback.type = "module";
      fallback.src = "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js";
      document.head.appendChild(fallback);
    }
  </script>

  <style>
    :root {
      --bg: #0c1220;
      --panel: #121b2c;
      --panel-border: #24304a;
      --text: #e8edf6;
      --text-dim: #93a1b8;
      --accent: #f5a623;
      --error: #ff6b6b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background:
        radial-gradient(1100px 520px at 75% -12%, #1b2a45 0%, rgba(27, 42, 69, 0) 60%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 22px clamp(16px, 4vw, 40px) 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4.5vw, 2.1rem);
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--text-dim);
      font-size: clamp(0.92rem, 3vw, 1.05rem);
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px clamp(16px, 4vw, 40px) 26px;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 900px) {
      .gallery { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }

    .viewer-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 11;
      min-height: 280px;
      background: #0a0f1a;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    .status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      color: var(--text-dim);
      pointer-events: none;
    }

    .status[hidden] { display: none; }
    .status.error { color: var(--error); }

    .info {
      padding: 14px 18px 18px;
    }

    .info h2 {
      margin: 0;
      font-size: 1.12rem;
      letter-spacing: 0.2px;
    }

    .info .desc {
      margin: 7px 0 12px;
      color: var(--text-dim);
      font-size: 0.93rem;
      line-height: 1.45;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
    }

    .chip {
      background: #1a2540;
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    footer {
      padding: 14px clamp(16px, 4vw, 40px) 22px;
      border-top: 1px solid var(--panel-border);
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
    }

    a { color: var(--accent); }

    @media (max-width: 520px) {
      .viewer-shell {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Indus Asset Viewer - Buildings</h1>
    <p class="subtitle">
      AI-textured, procedurally generated buildings for <strong>Indus : Battle Royale</strong> —
      drag to rotate, pinch or scroll to zoom.
    </p>
  </header>

  <main>
    <section id="gallery" class="gallery" aria-label="Building models"></section>
  </main>

  <footer>
    Automatically generated &amp; deployed by GitHub Actions &rarr; GitHub Pages.
  </footer>

  <script>
    // ------------------------------------------------------------------
    // Building catalogue — the viewer renders ONLY these four assets.
    // Each <model-viewer> is generated dynamically from this array.
    // ------------------------------------------------------------------
    const BUILDINGS = [
      {
        id: "garage",
        file: "models/buildings/garage.glb",
        name: "Garage",
        alt: "10m x 8m x 4m flat-roof garage with a large door cutout, concrete texture",
        desc: "Flat-roof garage with a 4 m x 3 m boolean door cutout, built at real-world scale.",
        dims: "10 m x 8 m x 4 m",
        material: "Concrete wall texture",
        orbit: "25deg 72deg 108%",
        eager: true
      },
      {
        id: "sniper_tower",
        file: "models/buildings/sniper_tower.glb",
        name: "Sniper Tower",
        alt: "4m x 4m wooden sniper tower, 10m tall with platform, railings and roof",
        desc: "Four wooden pillars, an 8 m platform with railings and a small roof — 10 m tall.",
        dims: "4 m x 4 m x 10 m",
        material: "Wood plank texture",
        orbit: "30deg 68deg 115%",
        eager: true
      },
      {
        id: "house_small",
        file: "models/buildings/house_small.glb",
        name: "Small House",
        alt: "6m x 6m brick house with wooden slanted roof, one door and two windows",
        desc: "Brick walls with a 1.2 m x 2.2 m door, two window cutouts and a wooden gable roof.",
        dims: "6 m x 6 m x 3.5 m",
        material: "Brick wall + wood plank",
        orbit: "28deg 70deg 108%",
        eager: false
      },
      {
        id: "warehouse",
        file: "models/buildings/warehouse.glb",
        name: "Warehouse",
        alt: "15m x 10m x 6m corrugated-metal warehouse with large sliding doors",
        desc: "Large 5 m x 4.5 m sliding door opening with parked metal panels, flat roof.",
        dims: "15 m x 10 m x 6 m",
        material: "Corrugated metal texture",
        orbit: "22deg 74deg 110%",
        eager: false
      }
    ];

    const gallery = document.getElementById("gallery");

    for (const b of BUILDINGS) {
      const card = document.createElement("article");
      card.className = "card";

      const shell = document.createElement("div");
      shell.className = "viewer-shell";

      // <model-viewer> generated dynamically from the BUILDINGS array
      const viewer = document.createElement("model-viewer");
      viewer.id = `viewer-${b.id}`;
      viewer.setAttribute("src", b.file);
      viewer.setAttribute("alt", b.alt);
      viewer.setAttribute("camera-controls", "");
      viewer.setAttribute("auto-rotate", "");
      viewer.setAttribute("rotation-per-second", "24deg");
      viewer.setAttribute("environment-image", "neutral");
      viewer.setAttribute("shadow-intensity", "1");
      viewer.setAttribute("shadow-softness", "0.7");
      viewer.setAttribute("exposure", "1");
      viewer.setAttribute("camera-orbit", b.orbit);
      viewer.setAttribute("interaction-prompt", "auto");
      viewer.setAttribute("loading", b.eager ? "eager" : "lazy");

      const status = document.createElement("div");
      status.className = "status";
      status.textContent = "Loading 3D model\u2026";

      viewer.addEventListener("load", () => { status.hidden = true; });
      viewer.addEventListener("error", () => {
        status.textContent = `Failed to load ${b.file} — is the asset deployed?`;
        status.classList.add("error");
      });

      shell.appendChild(viewer);
      shell.appendChild(status);

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `
        <h2>${b.name}</h2>
        <p class="desc">${b.desc}</p>
        <p class="chips">
          <span class="chip">${b.dims}</span>
          <span class="chip">${b.material}</span>
          <span class="chip">.glb · PBR</span>
        </p>`;

      card.appendChild(shell);
      card.appendChild(info);
      gallery.appendChild(card);
    }
  </script>
</body>
</html>
