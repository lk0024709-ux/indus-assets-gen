name: Validate & Deploy Mid-Poly Viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate published asset allowlist and GLB
        run: |
          python tools/validate_character_site.py
          python -m unittest discover -s tools -p 'test_*midpoly.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm ci --prefix tools/viewer-tests
          cd tools/viewer-tests
          npx playwright install --with-deps chromium
      - name: Test viewer and Idle/Walk playback in Chromium
        run: npm test --prefix tools/viewer-tests
      - name: Stage only public runtime files
        run: |
          mkdir -p _site/models/characters/skeleton _site/vendor
          cp docs/index.html docs/viewer.js _site/
          cp docs/vendor/model-viewer.min.js docs/vendor/model-viewer.LICENSE _site/vendor/
          cp docs/models/characters/body_base_midpoly.glb _site/models/characters/
          cp docs/models/characters/skeleton/skeleton_base_midpoly.glb _site/models/characters/skeleton/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
