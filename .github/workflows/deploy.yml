# ============================================================
# 3D Asset Pipeline: generate models with bpy, deploy to Pages
# ============================================================
name: Generate & Deploy 3D Assets

on:
  push:
    branches: [main]
  # Allow manual re-runs (e.g. after enabling Pages in settings)
  workflow_dispatch:

# Least-privilege token permissions for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Generate assets & deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxrender1 libxi6 libxkbcommon0 libsm6 libxext6 libxfixes3

      - name: Install bpy (Blender as a Python module) + texture tooling
        run: |
          python -m pip install --upgrade pip
          pip install bpy pillow numpy

      - name: Generate Phase 1 3D assets (terrain + buildings)
        run: python tools/generate_phase1.py

      - name: Generate Phase 2 3D assets (terrain, water, bridges, nature)
        run: |
          python tools/generate_terrain.py
          python tools/generate_water.py
          python tools/generate_bridges.py
          python tools/generate_nature.py

      - name: Generate Elite Cargo Dropship — Battle Royale drop ship (45 m span × 35 m, 4 nacelles, open cargo ramp)
        run: python tools/generate_plane_cargo_elite.py

      - name: Generate Mahal Palace Hot Drop POI (50×50×15m fortress)
        run: python tools/generate_mahal.py

      - name: Generate Mahal Palace Vibrant — Stylized Low-Poly (40×30 base)
        run: python tools/generate_mahal_vibrant.py

      - name: Generate Rajasthani Mahal Master — Exterior + Interior Darbar (40×30 base, 30×20×12)
        run: python tools/generate_mahal_master.py

      - name: Generate Modular Palace Blocks — wall/arch/dome/pillar (10×0.5×4, 10×0.5×6 arch, r5 dome, r0.5 h6 pillar)
        run: python tools/generate_modular.py

      - name: Generate Rajasthani Mahal Rooms + Mega Assembly (4 walk-in rooms 20×15/20×20/15×10/15×5 → 50×40 m, 2 floors, teal + 4 gold domes)
        run: python tools/generate_mahal_rooms.py

      - name: Generate 15 m Modular Building Blocks — walls, interior partitions, floor, roofs, stairs, furniture
        run: python tools/generate_building_modules.py

      - name: Assemble 11 Battle Royale Buildings with interior rooms + furniture into docs/models/buildings_modular/
        run: python tools/assemble_buildings.py


      # The 10 m set in docs/models/buildings/modular/ was superseded by the 15 m
      # kit in docs/models/buildings_modular/. Drop it so Pages never serves stale
      # same-named GLBs (e.g. school_yellow.glb) next to the new ones.
      - name: Remove superseded 10 m modular set
        run: rm -rf docs/models/buildings/modular

      # Keep res://assets/downloaded_models/rajasthani_mahal.glb (the Godot alias) in sync
      - name: Sync rajasthani_mahal.glb alias with the freshly generated master
        run: cp docs/models/buildings/mahal_palace_master.glb docs/models/buildings/rajasthani_mahal.glb

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # First run on a fresh repo: create the Pages site (build_type=workflow)
          # if it does not exist yet. Uses the workflow GITHUB_TOKEN (pages: write).
          enablement: true

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
