name: Validate & Deploy Mid-Poly Viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Retarget the Mixamo motion set onto the 27-bone rig. Runs first so the
  # animated GLB can be validated and published with the rest of the site.
  animated-character:
    uses: ./.github/workflows/build-animated-character.yml

  validate:
    needs: animated-character
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect the animated character build
        uses: actions/download-artifact@v4
        with:
          name: animated-character
          path: characters
      - name: Mirror the animated character into the Pages tree
        # The build products are gitignored, so the mirror the pipeline makes
        # locally does not exist on a fresh checkout -- recreate it here.
        run: |
          mkdir -p docs/models/characters/clothing
          cp characters/player_animated.glb characters/player_animated.report.json docs/models/characters/
          cp characters/clothing/*.glb docs/models/characters/clothing/
      - name: Validate published asset allowlist and GLB
        run: |
          python tools/validate_character_site.py
          python -m unittest discover -s tools -p 'test_*midpoly.py' -v
          REQUIRE_ANIMATED=1 python -m unittest tools.test_player_animated -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          npm ci --prefix tools/viewer-tests
          cd tools/viewer-tests
          npx playwright install --with-deps chromium
      - name: Test viewer and Idle/Walk playback in Chromium
        run: npm test --prefix tools/viewer-tests
      - name: Stage only public runtime files
        run: |
          mkdir -p _site/models/characters/skeleton _site/vendor
          cp docs/index.html docs/viewer.js docs/rig-viewer.js _site/
          cp docs/vendor/model-viewer.min.js docs/vendor/model-viewer.LICENSE _site/vendor/
          cp docs/models/characters/body_base_midpoly.glb _site/models/characters/
          cp docs/models/characters/body_base_female_midpoly.glb _site/models/characters/
          cp docs/models/characters/skeleton_base_midpoly.glb _site/models/characters/
          # Animated player + clothing: what the Godot repo syncs from Pages.
          mkdir -p _site/models/characters/clothing
          cp docs/models/characters/player_animated.glb _site/models/characters/
          cp docs/models/characters/player_animated.report.json _site/models/characters/
          cp docs/models/characters/clothing/*.glb _site/models/characters/clothing/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
