name: Validate & Deploy Indus Asset Viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Keep Playwright 1.56 supported; ubuntu-latest currently resolves to Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate published asset allowlist and GLB
        run: |
          python tools/validate_character_site.py
          python -m unittest discover -s tools -p 'test_*midpoly.py' -v
      - name: Install Blender for the Block 17 web model
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy
      - name: Generate Block 17 model for the web viewer
        run: |
          set +e
          blender --version
          blender --background --python tools/generate_block17_house.py -- --output "$GITHUB_WORKSPACE/docs/models/buildings/block17_house.glb" > /tmp/block17-blender.log 2>&1
          result=$?
          cat /tmp/block17-blender.log
          if [ "$result" -ne 0 ] || [ ! -s docs/models/buildings/block17_house.glb ]; then
            detail=$(tail -n 8 /tmp/block17-blender.log | tr '\n' ' ' | cut -c 1-1000)
            echo "::error title=Block 17 generation::exit=$result, glb_present=$([ -s docs/models/buildings/block17_house.glb ] && echo yes || echo no); $detail"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tooling
        run: |
          set +e
          npm ci --prefix tools/viewer-tests > /tmp/viewer-npm.log 2>&1
          result=$?
          cat /tmp/viewer-npm.log
          if [ "$result" -ne 0 ]; then
            detail=$(tail -n 8 /tmp/viewer-npm.log | tr '\n' ' ' | cut -c 1-1000)
            echo "::error title=Browser tooling install::npm ci exit=$result; $detail"
            exit "$result"
          fi
          cd tools/viewer-tests
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1
          result=$?
          cat /tmp/playwright-install.log
          if [ "$result" -ne 0 ]; then
            detail=$(tail -n 8 /tmp/playwright-install.log | tr '\n' ' ' | cut -c 1-1000)
            echo "::error title=Browser tooling install::Playwright install exit=$result; $detail"
            exit "$result"
          fi
      - name: Test viewer and Idle/Walk playback in Chromium
        run: npm test --prefix tools/viewer-tests
      - name: Stage public viewer files and models
        run: |
          mkdir -p _site/models/characters/skeleton _site/models/buildings _site/vendor
          cp docs/index.html docs/block17.html docs/viewer.js docs/rig-viewer.js _site/
          cp docs/vendor/model-viewer.min.js docs/vendor/model-viewer.LICENSE _site/vendor/
          cp docs/models/characters/body_base_midpoly.glb _site/models/characters/
          cp docs/models/characters/body_base_female_midpoly.glb _site/models/characters/
          cp docs/models/characters/skeleton_base_midpoly.glb _site/models/characters/
          cp docs/models/buildings/block17_house.glb _site/models/buildings/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
