# ============================================================
# 3D Asset Pipeline: generate models with bpy, deploy to Pages
# ============================================================
name: Generate & Deploy 3D Assets

on:
  push:
    branches: [main]
  # Allow manual re-runs (e.g. after enabling Pages in settings)
  workflow_dispatch:

# Least-privilege token permissions for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Generate assets & deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxrender1 libxi6 libxkbcommon0 libsm6 libxext6 libxfixes3

      - name: Install bpy (Blender as a Python module)
        run: |
          python -m pip install --upgrade pip
          pip install bpy

      - name: Generate 3D assets
        run: python tools/generate_test.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
