name: Validate & Deploy 3D Asset Viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild embedded superhero GLBs, Battle Royale outfits, and motion manifest
        run: |
          python tools/build_superhero_characters.py
          python tools/build_battle_royale_outfits.py
          python tools/build_motion_manifest.py

      - name: Test character packaging, outfits, motion manifest, and source texture variants
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Check backend Python syntax
        run: python -m compileall -q procedural_asset_app/backend tools

      - name: Check viewer JavaScript syntax
        run: |
          node --check procedural_asset_app/frontend/character-viewer.js
          node --check procedural_asset_app/frontend/motion-retarget.js
          node --check procedural_asset_app/frontend/glb-combine.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script" and "src" not in dict(attrs):
                      self.active = True

              def handle_endtag(self, tag):
                  if tag == "script":
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)

          parser = InlineScripts()
          parser.feed(Path("procedural_asset_app/frontend/asset-viewer.html").read_text(encoding="utf-8"))
          Path("/tmp/asset-viewer-inline.js").write_text("\n".join(parser.parts), encoding="utf-8")
          if not parser.parts:
              raise SystemExit("No inline viewer script found")
          PY
          node --check /tmp/asset-viewer-inline.js

      - name: Validate and retarget all 74 source FBX clips
        run: |
          npm install --prefix "$RUNNER_TEMP/three-validation" --no-save --no-package-lock three@0.166.1
          THREE_PACKAGE="$RUNNER_TEMP/three-validation/node_modules/three" node tools/validate_motion_retarget.mjs

      - name: Stage static viewer site
        run: |
          mkdir -p _site/assets/motions
          cp procedural_asset_app/frontend/asset-viewer.html _site/index.html
          cp procedural_asset_app/frontend/asset-viewer.html _site/asset-viewer.html
          cp procedural_asset_app/frontend/asset-viewer-source.md _site/
          cp procedural_asset_app/frontend/characters.html \
             procedural_asset_app/frontend/character-viewer.css \
             procedural_asset_app/frontend/character-viewer.js \
             procedural_asset_app/frontend/glb-combine.js \
             procedural_asset_app/frontend/motion-retarget.js _site/
          cp -R procedural_asset_app/frontend/assets/characters _site/assets/
          cp -R procedural_asset_app/frontend/assets/outfits _site/assets/
          cp procedural_asset_app/frontend/assets/motion-manifest.json _site/assets/
          cp "Base model /Motion/"*.fbx _site/assets/motions/
          test "$(find _site/assets/motions -maxdepth 1 -name '*.fbx' | wc -l)" -eq 74
          test -s _site/index.html
          test -s _site/characters.html
          test -s _site/assets/characters/superhero_female_dark.glb
          test -s _site/assets/characters/superhero_female_light.glb
          test -s _site/assets/characters/superhero_male_dark.glb
          test -s _site/assets/characters/superhero_male_light.glb
          test -s _site/assets/outfits/outfit_br_female.glb
          test -s _site/assets/outfits/outfit_br_male.glb
          test -s _site/assets/outfits/outfit_battle_royale.glb

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
