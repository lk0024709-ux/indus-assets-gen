name: Procedural Asset App Checks
on:
  push:
    paths:
      - 'procedural_asset_app/**'
      - '.github/workflows/procedural-asset-app-check.yml'
  pull_request:
    paths:
      - 'procedural_asset_app/**'
      - '.github/workflows/procedural-asset-app-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: python -m compileall -q procedural_asset_app/backend
      - name: Test Character Studio motion and web UI
        run: python -m unittest discover -s tools -p 'test_character_motion_ui.py' -v
      - name: Validate static assets and recipe coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("procedural_asset_app")
          required = [
              "backend/main.py", "backend/registry.py", "backend/blender_worker.py",
              "backend/recipes/battle_royale_outfit.py",
              "backend/recipes/chair.py", "backend/recipes/table.py",
              "backend/recipes/lamp.py", "backend/recipes/rock.py",
              "backend/recipes/barrel.py", "frontend/index.html",
              "frontend/app.js", "frontend/web-recipes.js", "frontend/style.css",
              "frontend/asset-viewer.html", "frontend/asset-viewer-source.md",
              "frontend/characters.html", "frontend/character-viewer.css",
              "frontend/character-viewer.js", "frontend/glb-combine.js",
              "frontend/motion-retarget.js",
              "frontend/assets/outfits/outfits.json",
              "frontend/assets/motion-manifest.json",
              "README.md", "run.sh"
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          text = (root / "backend/registry.py").read_text()
          web_recipes_text = (root / "frontend/web-recipes.js").read_text()
          for recipe in ("battle_royale_outfit", "chair", "table", "lamp", "rock", "barrel"):
              assert recipe in text, f"Recipe not registered in backend: {recipe}"
              assert recipe in web_recipes_text, f"Recipe not registered in web-recipes.js: {recipe}"
          assert "timeout=60" in (root / "backend/main.py").read_text()
          motions = json.loads((root / "frontend/assets/motion-manifest.json").read_text())
          assert motions["count"] == len(motions["motions"]) == 74
          outfits = json.loads((root / "frontend/assets/outfits/outfits.json").read_text())
          assert len(outfits["outfits"]) == 3
          print("Required app files, six recipes (backend + web), three outfit GLBs, and 74 motion entries verified.")
          PY
