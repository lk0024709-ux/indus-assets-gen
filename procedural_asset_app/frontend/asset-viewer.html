<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indus 3D Asset Viewer</title>
<style>
:root{--bg:#eceef2;--panel:rgba(255,255,255,.88);--fg:#14171c;--mut:#6a7280;--acc:#2f5bff;--accfg:#fff;--bd:#d9dde5;--hi:#e8ecff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--panel:rgba(30,34,42,.88);--fg:#eef0f4;--mut:#8b93a1;--acc:#6f8cff;--accfg:#0d1020;--bd:#2d333e;--hi:#262d45}}
:root[data-theme="dark"]{--bg:#15181e;--panel:rgba(30,34,42,.88);--fg:#eef0f4;--mut:#8b93a1;--acc:#6f8cff;--accfg:#0d1020;--bd:#2d333e;--hi:#262d45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#v{position:absolute;inset:0}
#v canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px}
#info{position:absolute;top:12px;left:12px;max-width:calc(100% - 24px);padding:9px 14px;pointer-events:none}
#info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info span{color:var(--mut);font-size:12.5px}
#studioLink{display:inline-block;margin-top:5px;color:var(--acc);font-size:11px;text-decoration:none;pointer-events:auto}
#studioLink:hover{text-decoration:underline}
#library{position:absolute;top:12px;right:12px;max-width:calc(100% - 24px);padding:6px;display:flex;gap:6px;align-items:center}
#library select{width:min(230px,48vw);height:42px;flex:1}
#libLoad{height:42px;border:0;border-radius:10px;padding:0 13px;background:var(--acc);color:var(--accfg);font:700 12px system-ui,sans-serif;white-space:nowrap;cursor:pointer}
#libLoad:disabled{opacity:.5;cursor:wait}
#hint{position:absolute;left:0;right:0;bottom:150px;text-align:center;color:var(--mut);pointer-events:none;padding:0 24px;font-size:13px}
#anim,#dock{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px)}
#dock{bottom:12px;display:flex;gap:4px;padding:6px;overflow-x:auto;scrollbar-width:none;width:max-content}
#dock::-webkit-scrollbar{display:none}
.b{flex:0 0 auto;min-width:62px;height:58px;border:0;border-radius:13px;background:transparent;color:var(--fg);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.b i{font-style:normal;font-size:19px;line-height:1}
.b:hover{background:var(--hi)}
.b.on{background:var(--hi);color:var(--acc)}
.b.pri{background:var(--acc);color:var(--accfg)}
.b.off{opacity:.38}
.b:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#anim{bottom:90px;width:480px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#anim.hide{display:none}
.row{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;padding:0 8px}
#pp{width:44px;height:40px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font-size:16px;cursor:pointer}
input[type=range]{flex:1;accent-color:var(--acc);height:30px}
#toast{position:absolute;top:68px;left:50%;transform:translateX(-50%);padding:10px 16px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#drop{position:absolute;inset:10px;border:2px dashed var(--acc);border-radius:22px;display:none;align-items:center;justify-content:center;font-size:18px;background:var(--hi);opacity:.92}
#drop.show{display:flex}
@media (max-width:560px){#info{top:10px;left:10px;max-width:calc(100% - 20px)}#library{top:61px;right:10px;left:10px;max-width:none}#library select{width:auto;min-width:0}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="v"></div>
<div id="info" class="glass"><b id="nm">Indus character</b><span id="st">Choose a built-in hero or open a local model.</span><br><a id="studioLink" href="./characters.html">Character Studio ↗</a></div>
<div id="library" class="glass" aria-label="Built-in character models"><select id="libSel" aria-label="Built-in character"></select><button id="libLoad" type="button">Load character</button></div>
<div id="hint">Open a model to begin &mdash; GLB, GLTF, FBX or OBJ</div>
<div id="anim" class="glass hide">
  <div class="row"><button id="pp" aria-label="Play or pause">&#10074;&#10074;</button><select id="sel" aria-label="Animation clip"></select><select id="spd" aria-label="Speed" style="flex:0 0 78px"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></div>
  <div class="row"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Timeline"></div>
</div>
<div id="dock" class="glass" role="toolbar" aria-label="Viewer tools">
  <button class="b pri" id="bOpen"><i>&#128194;</i>Open</button>
  <button class="b off" id="bMotion"><i>&#127939;</i>Add motion</button>
  <button class="b" id="bWire"><i>&#9638;</i>Wireframe</button>
  <button class="b" id="bBones"><i>&#129460;</i>Skeleton</button>
  <button class="b on" id="bGrid"><i>&#9707;</i>Grid</button>
  <button class="b" id="bRot"><i>&#10227;</i>Spin</button>
  <button class="b" id="bTheme"><i>&#9680;</i>Theme</button>
  <button class="b" id="bReset"><i>&#8982;</i>Reset view</button>
</div>
<div id="toast" class="glass"></div>
<div id="drop">Drop a model file</div>
<input type="file" id="fModel" hidden>
<input type="file" id="fMotion" hidden>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script>
const $=s=>document.querySelector(s);
const root=document.documentElement;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,.01,1000);
const rd=new THREE.WebGLRenderer({antialias:true});
rd.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
rd.outputEncoding=THREE.sRGBEncoding;
$('#v').appendChild(rd.domElement);
const ctl=new THREE.OrbitControls(cam,rd.domElement);
ctl.enableDamping=true;ctl.screenSpacePanning=true;ctl.autoRotateSpeed=1.6;

scene.add(new THREE.HemisphereLight(0xffffff,0x555566,.95));
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(3,6,4);scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,.35);fill.position.set(-4,2,-3);scene.add(fill);
const grid=new THREE.GridHelper(20,40,0x8a93a6,0x8a93a6);
grid.material.transparent=true;grid.material.opacity=.3;scene.add(grid);

let model,mixer,clips=[],action,helper,playing=true,speed=1,wire=false,showBones=false,hasSkel=false,scrub=false;
const clock=new THREE.Clock();

function applyBg(){scene.background=new THREE.Color(getComputedStyle(root).getPropertyValue('--bg').trim()||'#15181e')}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyBg);
applyBg();

function resize(){const e=$('#v');rd.setSize(e.clientWidth,e.clientHeight);cam.aspect=e.clientWidth/e.clientHeight;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('#v'));resize();

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}

const ext=n=>n.split('.').pop().toLowerCase();
const assetUrl=file=>new URL('./assets/characters/'+encodeURIComponent(file),document.baseURI).href;
const readBuf=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Could not read file'));r.readAsArrayBuffer(f)});
async function parseFile(f){
  const e=ext(f.name),b=await readBuf(f);
  if(e==='glb'||e==='gltf')return new Promise((ok,no)=>new THREE.GLTFLoader().parse(e==='gltf'?new TextDecoder().decode(b):b,'',g=>ok({obj:g.scene,anims:g.animations}),x=>no(new Error(x.message||'Invalid glTF'))));
  if(e==='fbx'){const o=new THREE.FBXLoader().parse(b,'');return{obj:o,anims:o.animations||[]}}
  if(e==='obj'){const o=new THREE.OBJLoader().parse(new TextDecoder().decode(b));return{obj:o,anims:[]}}
  throw new Error('Unsupported file type: .'+e+' (use GLB, GLTF, FBX or OBJ)');
}

function frame(o){
  const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
  const d=Math.max(s.x,s.y,s.z)||1;
  ctl.target.copy(c);cam.position.set(c.x+d*1.1,c.y+d*.55,c.z+d*1.8);
  cam.near=d/100;cam.far=d*200;cam.updateProjectionMatrix();
  grid.position.y=b.min.y;grid.scale.setScalar(d/10);ctl.update();
}
const home=()=>model&&frame(model);

function clearModel(){
  if(!model)return;
  mixer&&mixer.stopAllAction();
  scene.remove(model);
  const textures=new Set();
  model.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    [].concat(o.material||[]).forEach(m=>{
      if(!m)return;
      Object.values(m).forEach(v=>v&&v.isTexture&&textures.add(v));
      m.dispose();
    });
    o.skeleton&&o.skeleton.dispose();
  });
  textures.forEach(t=>t.dispose());
  if(helper){scene.remove(helper);helper=null}
}

function setModel(obj,anims,name){
  clearModel();model=obj;scene.add(model);
  let tris=0,bones=0;
  model.traverse(o=>{
    if(o.isBone)bones++;
    if(o.isMesh){const g=o.geometry;tris+=(g.index?g.index.count:g.attributes.position.count)/3;
      if(o.isSkinnedMesh)o.frustumCulled=false;
      [].concat(o.material).forEach(m=>{if(m)m.wireframe=wire})}
  });
  hasSkel=bones>0;
  if(hasSkel){helper=new THREE.SkeletonHelper(model);helper.visible=showBones;scene.add(helper)}
  mixer=new THREE.AnimationMixer(model);action=null;clips=anims.slice();
  frame(model);
  $('#bMotion').classList.toggle('off',!hasSkel);
  $('#nm').textContent=name;
  $('#st').textContent=[Math.round(tris).toLocaleString()+' triangles',hasSkel?bones+' bones':'no skeleton',clips.length+' clips'].join('  |  ');
  $('#hint').style.display='none';
  fillClips();if(clips.length)play(0);
}

function fillClips(){
  const s=$('#sel');s.innerHTML='';
  clips.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.name||('Clip '+(i+1));s.appendChild(o)});
  $('#anim').classList.toggle('hide',!clips.length);
  $('#st').textContent=$('#st').textContent.replace(/\d+ clips$/,clips.length+' clips');
}

function play(i){
  if(!clips[i]||!mixer)return;
  if(action)action.stop();
  action=mixer.clipAction(clips[i]);action.reset().play();
  $('#sel').value=i;playing=true;$('#pp').innerHTML='&#10074;&#10074;';
}

/* Match motion bones to the character by normalised name (handles Mixamo prefixes). */
const norm=n=>n.replace(/^mixamorig[:_]?/i,'').replace(/[^a-z0-9]/gi,'').toLowerCase();
function retarget(clip){
  const map={};model.traverse(o=>{if(o.isBone)map[norm(o.name)]=o});
  const tracks=[];
  clip.tracks.forEach(t=>{
    const i=t.name.lastIndexOf('.'),prop=t.name.slice(i+1);
    const node=t.name.slice(0,i).split('/').pop();
    const bone=map[norm(node)];if(!bone)return;
    const isRoot=norm(bone.name)==='hips'||!(bone.parent&&bone.parent.isBone);
    if(prop==='position'&&!isRoot)return;
    if(prop==='scale')return;
    const nt=t.clone();nt.name=bone.name+'.'+prop;
    if(prop==='position'){
      const k=(bone.position.y&&t.values[1])?Math.min(Math.max(Math.abs(bone.position.y/t.values[1]),.0001),1000):1;
      for(let j=0;j<nt.values.length;j++)nt.values[j]*=k;
    }
    tracks.push(nt);
  });
  return tracks.length?new THREE.AnimationClip(clip.name,clip.duration,tracks):null;
}

async function addMotion(f){
  try{
    toast('Reading motion...');
    const r=await parseFile(f);
    if(!r.anims.length)return toast('No animation found in that file. Use a GLB or FBX with motion.');
    const first=clips.length;let n=0;
    r.anims.forEach(c=>{const x=retarget(c);if(x){x.name=(r.anims.length>1?c.name:f.name.replace(/\.[^.]+$/,''));clips.push(x);n++}});
    if(!n)return toast('Bone names do not match this character.');
    fillClips();play(first);toast('Added '+n+' motion'+(n>1?'s':''));
  }catch(e){toast(e.message)}
}

async function openModel(f){
  try{toast('Loading '+f.name+'...');const r=await parseFile(f);setModel(r.obj,r.anims,f.name);toast('Loaded')}
  catch(e){toast(e.message||'Could not open this file')}
}

async function openBuiltin(record){
  if(!record)return;
  $('#libLoad').disabled=true;
  try{
    toast('Loading '+record.label+'...');
    const response=await fetch(assetUrl(record.file));
    if(!response.ok)throw new Error('Could not fetch '+record.file);
    const data=await response.arrayBuffer();
    const parsed=await new Promise((ok,no)=>new THREE.GLTFLoader().parse(data,'',g=>ok({obj:g.scene,anims:g.animations||[]}),e=>no(new Error(e.message||'Invalid GLB'))));
    setModel(parsed.obj,parsed.anims,record.label);
    toast('Loaded '+record.label);
  }catch(e){toast(e.message||'Could not load this character')}
  finally{$('#libLoad').disabled=false}
}

async function loadLibrary(){
  const select=$('#libSel');
  try{
    const response=await fetch(assetUrl('characters.json'));
    if(!response.ok)throw new Error('Character library unavailable');
    const manifest=await response.json();
    manifest.models.forEach(record=>{
      const option=document.createElement('option');
      option.value=record.id;option.textContent=record.label;select.appendChild(option);
    });
    const initial=manifest.models.find(record=>record.id==='superhero_female_dark')||manifest.models[0];
    if(initial){select.value=initial.id;$('#libLoad').onclick=()=>openBuiltin(manifest.models.find(record=>record.id===select.value));await openBuiltin(initial)}
  }catch(e){$('#libLoad').disabled=true;toast('Built-in heroes unavailable. Use Open or drop a model file.')}
}

/* Buttons */
$('#bOpen').onclick=()=>$('#fModel').click();
$('#bMotion').onclick=()=>hasSkel?$('#fMotion').click():toast('This model has no skeleton, so motion cannot be added.');
$('#fModel').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&openModel(f)};
$('#fMotion').onchange=e=>{const f=e.target.files[0];e.target.value='';f&&addMotion(f)};
$('#bWire').onclick=e=>{wire=!wire;e.currentTarget.classList.toggle('on',wire);model&&model.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>m&&(m.wireframe=wire))})};
$('#bBones').onclick=e=>{if(!hasSkel)return toast('No skeleton in this model.');showBones=!showBones;helper.visible=showBones;e.currentTarget.classList.toggle('on',showBones)};
$('#bGrid').onclick=e=>{grid.visible=!grid.visible;e.currentTarget.classList.toggle('on',grid.visible)};
$('#bRot').onclick=e=>{ctl.autoRotate=!ctl.autoRotate;e.currentTarget.classList.toggle('on',ctl.autoRotate)};
$('#bReset').onclick=home;
const modes=['auto','dark','light'];let mi=0;
$('#bTheme').onclick=()=>{mi=(mi+1)%3;modes[mi]==='auto'?root.removeAttribute('data-theme'):root.setAttribute('data-theme',modes[mi]);applyBg();toast('Theme: '+modes[mi])};
$('#pp').onclick=()=>{playing=!playing;$('#pp').innerHTML=playing?'&#10074;&#10074;':'&#9654;'};
$('#sel').onchange=e=>play(+e.target.value);
$('#spd').onchange=e=>speed=+e.target.value;
const seek=$('#seek');
seek.oninput=()=>{if(!action)return;scrub=true;action.time=seek.value/1000*action.getClip().duration;mixer.update(0)};
seek.onchange=()=>scrub=false;

/* Drag and drop (desktop) */
let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').classList.add('show')});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;$('#drop').classList.remove('show')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').classList.remove('show');const f=e.dataTransfer.files[0];f&&openModel(f)});

loadLibrary();

(function tick(){
  requestAnimationFrame(tick);
  const dt=clock.getDelta();
  if(mixer&&action&&playing)mixer.update(dt*speed);
  if(action&&!scrub){const d=action.getClip().duration||1;seek.value=((action.time%d)/d)*1000}
  ctl.update();rd.render(scene,cam);
})();
</script>
</body>
</html>
